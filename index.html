<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hasan Tarla — Uygulamalar</title>
<style>
  :root { --fg:#1a1a1a; --muted:#666; --accent:#1565C0; --bg:#fff; --card:#f6f8fb; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e8e8; --muted:#a0a0a0; --bg:#121212; --card:#1e1e1e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65; font-size:16px; }
  main { max-width:640px; margin:0 auto; padding:48px 20px 80px; }
  h1 { font-size:1.8rem; margin:0 0 8px; }
  p { color:var(--fg); }
  .muted { color:var(--muted); font-size:.9rem; }
  a { color:var(--accent); }
  .card { background:var(--card); border-radius:12px; padding:16px 20px; margin:16px 0; }
  ul { padding-left:22px; }
</style>
</head>
<body>
<main>
  <h1>Hasan Tarla</h1>
  <p class="muted">Mobil uygulamalar · Android &amp; iOS</p>

  <div class="card">
    <strong>Harfora</strong><br>
    Türkçe kelime oyunları için akıllı çözüm yardımcısı.<br>
    <a href="privacy.html">Gizlilik Politikası / Privacy Policy</a>
  </div>

  <div class="card">
    <strong>Harfora Premium</strong><br>
    Yeni nesil, gelişmiş kelime çözümleyici.<br>
    <a href="privacy.html">Gizlilik Politikası / Privacy Policy</a>
  </div>

  <p class="muted">İletişim: <a href="mailto:hasantarla.apps@gmail.com">hasantarla.apps@gmail.com</a></p>
</main>
</body>
</html>
